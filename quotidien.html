<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths du quotidien · MathHorizon</title><link rel="stylesheet" href="theme.css"><style>*{box-sizing:border-box}body{margin:0;background:#edf4f5;color:#193b4a;font:20px/1.5 system-ui,sans-serif}main{max-width:850px;margin:24px auto;padding:20px}a{color:#155b61}article{background:white;border:1px solid #c4d9dd;border-radius:24px;padding:clamp(18px,4vw,36px)}h1{font-size:clamp(26px,5vw,38px)}button{font:inherit;font-weight:650;min-height:56px;padding:12px 20px;border:2px solid #78a5ac;border-radius:14px;background:#fff;color:#174b59;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #174b59;outline-offset:4px}button:disabled{opacity:.65}#choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:24px 0}#visual{background:#e9f5f1;border-radius:18px;padding:24px;text-align:center;font-size:clamp(24px,5vw,40px);font-weight:700;white-space:pre-line}#next{background:#155b61;color:white}#feedback{min-height:3em}progress{width:100%;accent-color:#176a72} [hidden]{display:none!important}.mini-grid{display:grid;justify-content:center;gap:5px;margin:18px auto 0}.mini-grid span{display:grid;place-items:center;aspect-ratio:1;border:2px solid #719ca5;border-radius:7px;background:white;font-size:24px}.mini-grid .filled{background:#85cfc1;color:#174b59}</style></head><body><main><a href="index.html#quotidien">← Retour aux activités</a><h1 id="title"></h1><article><p id="count"></p><progress id="progress" max="8" value="0"></progress><p id="question"></p><button id="listen">Écouter la consigne</button><div id="visual"></div><div id="choices"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" hidden>Suivant →</button><button id="restart" hidden>Recommencer</button><p id="save-status" role="status"></p></article></main><script src="compte.js"></script><script src="quotidien.js"></script></body></html>
